<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#000000"/>

  <!-- Subtle grid texture -->
  <line x1="0" y1="480" x2="1080" y2="480" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="960" x2="1080" y2="960" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="1440" x2="1080" y2="1440" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>
  <line x1="540" y1="0" x2="540" y2="1920" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>

  <!-- Brand -->
  <rect x="80" y="140" width="60" height="2" fill="#FFFFFF" opacity="0.3"/>
  <text x="80" y="190" font-size="28" font-weight="400" letter-spacing="8" fill="#FFFFFF" opacity="0.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">kÖr</text>

  <!-- Category label -->
  <text x="80" y="680" font-size="22" font-weight="600" letter-spacing="8" fill="#FFFFFF" opacity="0.35" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">COLECCIÓN</text>

  <!-- Main word -->
  <text x="72" y="860" font-size="180" font-weight="900" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" letter-spacing="-6">CON</text>
  <text x="72" y="1040" font-size="180" font-weight="900" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" letter-spacing="-6">JUN</text>
  <text x="72" y="1220" font-size="180" font-weight="900" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" letter-spacing="-6">TOS</text>

  <!-- Price badge -->
  <rect x="80" y="1280" width="360" height="78" fill="#FFFFFF" rx="3"/>
  <text x="260" y="1333" font-size="42" font-weight="900" fill="#000000" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="-1">Desde $25</text>

  <!-- CTA -->
  <text x="80" y="1440" font-size="40" font-weight="300" fill="#FFFFFF" opacity="0.6" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">DM para pedir 🖤</text>

  <!-- Bottom -->
  <text x="80" y="1780" font-size="30" font-weight="400" letter-spacing="4" fill="#FFFFFF" opacity="0.4" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">@_korsv</text>
  <rect x="80" y="1800" width="920" height="1" fill="#FFFFFF" opacity="0.1"/>
  <text x="80" y="1840" font-size="22" font-weight="300" letter-spacing="3" fill="#FFFFFF" opacity="0.25" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">ACTIVEWEAR PREMIUM · EL SALVADOR</text>
</svg>
