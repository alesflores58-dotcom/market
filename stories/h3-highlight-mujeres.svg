<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#000000"/>
  <rect x="80" y="80" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="80" y="80" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>
  <rect x="960" y="80" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="998" y="80" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>
  <rect x="80" y="1840" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="80" y="1800" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>
  <rect x="960" y="1840" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="998" y="1800" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>

  <!-- Venus symbol — geometric construction -->
  <!-- Circle -->
  <circle cx="540" cy="860" r="200" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <!-- Vertical line -->
