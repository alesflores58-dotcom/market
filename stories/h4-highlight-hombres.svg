<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#000000"/>
  <rect x="80" y="80" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="80" y="80" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>
  <rect x="960" y="80" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="998" y="80" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>
  <rect x="80" y="1840" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="80" y="1800" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>
  <rect x="960" y="1840" width="40" height="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="998" y="1800" width="2" height="40" fill="#FFFFFF" opacity="0.2"/>

  <!-- Mars symbol — geometric construction -->
  <!-- Circle -->
  <circle cx="520" cy="980" r="200" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <!-- Arrow shaft -->
  <line x1="690" y1="810" x2="820" y2="680" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrowhead horizontal -->
  <line x1="700" y1="680" x2="820" y2="680" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrowhead vertical -->
  <line x1="820" y1="680" x2="820" y2="800" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <text x="540" y="1620" font-size="32" font-weight="400" letter-spacing="12" fill="#FFFFFF" opacity="0.4" font-family="'PP Neue Montreal','Neue Haas Grotesk','Helvetica Neue',Arial,sans-serif" text-anchor="middle">HOMBRES</text>
</svg>
