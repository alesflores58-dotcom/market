  <text x="80" y="1116" font-size="58" font-weight="700" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" letter-spacing="-1">y talla en</text>
  <text x="80" y="1192" font-size="58" font-weight="700" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" letter-spacing="-1">nuestro feed</text>

  <!-- Detail -->
  <text x="80" y="1310" font-size="34" font-weight="300" fill="#FFFFFF" opacity="0.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">Visita el link en nuestra bio</text>
  <text x="80" y="1358" font-size="34" font-weight="300" fill="#FFFFFF" opacity="0.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">y explora el catálogo completo.</text>

  <!-- Bottom -->
  <text x="80" y="1780" font-size="30" font-weight="400" letter-spacing="4" fill="#FFFFFF" opacity="0.4" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">@_korsv</text>
  <rect x="80" y="1800" width="920" height="1" fill="#FFFFFF" opacity="0.1"/>
  <text x="80" y="1840" font-size="22" font-weight="300" letter-spacing="3" fill="#FFFFFF" opacity="0.25" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">ACTIVEWEAR PREMIUM · EL SALVADOR</text>
