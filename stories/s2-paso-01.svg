<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#000000"/>

  <!-- Step number — giant background -->
  <text x="800" y="700" font-size="480" font-weight="900" fill="#FFFFFF" opacity="0.03" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">01</text>

  <!-- Top brand -->
  <rect x="80" y="140" width="60" height="2" fill="#FFFFFF" opacity="0.3"/>
  <text x="80" y="190" font-size="28" font-weight="400" letter-spacing="8" fill="#FFFFFF" opacity="0.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">kÖr</text>

  <!-- Step label -->
  <text x="80" y="760" font-size="22" font-weight="600" letter-spacing="6" fill="#FFFFFF" opacity="0.4" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">PASO</text>

  <!-- Step number display -->
  <text x="80" y="900" font-size="140" font-weight="900" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" letter-spacing="-4">01</text>

  <!-- Divider -->
  <rect x="80" y="940" width="80" height="2" fill="#FFFFFF"/>

  <!-- Instruction -->
